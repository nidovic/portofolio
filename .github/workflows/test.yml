name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  build:
    uses: ./.github/workflows/build.yml

  api-test:
    uses: ./.github/workflows/api-test.yml

  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/PortfolioE2E
      MONGODB_DB_NAME: PortfolioE2E
      VITE_API_BASE_URL: http://127.0.0.1:5001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm run lint
      - run: npm run coverage:client
      - run: npm run build:server
      - name: Run server tests and coverage
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          npm run coverage:server
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build --prefix client
      - name: Install browser for E2E tests
        run: npx --prefix client playwright install --with-deps chromium
      - run: npm run test:e2e --prefix client
      - name: Upload E2E screenshots and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            client/test-results/
            client/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
