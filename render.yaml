services:
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 26.10.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: Portfolio
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
  - type: web
    name: portfolio-web
    runtime: static
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: npm ci --prefix client && npm run build --prefix client
    staticPublishPath: ./client/dist
    envVars:
      - key: NODE_VERSION
        value: 26.10.0
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
